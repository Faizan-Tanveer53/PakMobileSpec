<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="720" height="760">
  <defs>
    <linearGradient id="back-realme-c67" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="scr-realme-c67" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#422006"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="glow-realme-c67" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop-realme-c67" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Ambient Backlight Glow -->
  <circle cx="185" cy="190" r="145" fill="url(#glow-realme-c67)"/>

  <!-- REAR CHASSIS (Left Device Showing Exact Model Camera Architecture) -->
  <g filter="url(#drop-realme-c67)">
    <rect x="54" y="42" width="136" height="286" rx="22" fill="url(#back-realme-c67)" stroke="#facc15" stroke-width="2.5"/>
    <!-- Metallic Glass Diagonal Sheen -->
    <path d="M 60 44 L 145 44 L 85 326 L 56 326 Z" fill="#ffffff" fill-opacity="0.07"/>
    
        <!-- Realme 12 Pro+ Golden Watch Bezel + Vertical Seam -->
        <line x1="122" y1="44" x2="122" y2="326" stroke="#facc15" stroke-width="2" stroke-dasharray="3,2"/>
        <circle cx="122" cy="112" r="46" fill="#090d16" stroke="#facc15" stroke-width="3.5"/>
        <circle cx="106" cy="100" r="10" fill="#000" stroke="#eab308" stroke-width="1.5"/>
        <circle cx="138" cy="100" r="10" fill="#000" stroke="#eab308" stroke-width="1.5"/>
        <rect x="114" y="118" width="16" height="14" rx="3" fill="#000" stroke="#eab308" stroke-width="1.5"/>
        
    <text x="122" y="302" text-anchor="middle" fill="#ffffff" fill-opacity="0.55" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="800" letter-spacing="2">REALME</text>
  </g>

  <!-- FRONT DISPLAY (Right Overlapping Device Showing Screen & Wallpaper) -->
  <g filter="url(#drop-realme-c67)">
    <rect x="172" y="38" width="138" height="292" rx="22" fill="#050811" stroke="#facc15" stroke-width="2.5"/>
    <rect x="177" y="43" width="128" height="282" rx="19" fill="url(#scr-realme-c67)"/>
    <!-- Dynamic Abstract Wallpaper Graphic -->
    <circle cx="241" cy="165" r="56" fill="#fde047" fill-opacity="0.28"/>
    <path d="M 177 220 Q 241 155 305 240 L 305 325 L 177 325 Z" fill="#64748b" fill-opacity="0.32"/>
    <circle cx="241" cy="57" r="4.5" fill="#050811"/>
    <!-- Clean Model Signature on Screen -->
    <text x="241" y="102" text-anchor="middle" fill="#ffffff" fill-opacity="0.8" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2">REALME</text>
    <text x="241" y="122" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800">Realme C67</text>
  </g>
</svg>