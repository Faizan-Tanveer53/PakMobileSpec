<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="720" height="760">
  <defs>
    <linearGradient id="back-xiaomi-14-ultra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="scr-xiaomi-14-ultra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="glow-xiaomi-14-ultra" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop-xiaomi-14-ultra" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Ambient Backlight Glow -->
  <circle cx="185" cy="190" r="145" fill="url(#glow-xiaomi-14-ultra)"/>

  <!-- REAR CHASSIS (Left Device Showing Exact Model Camera Architecture) -->
  <g filter="url(#drop-xiaomi-14-ultra)">
    <rect x="54" y="42" width="136" height="286" rx="22" fill="url(#back-xiaomi-14-ultra)" stroke="#d4af37" stroke-width="2.5"/>
    <!-- Metallic Glass Diagonal Sheen -->
    <path d="M 60 44 L 145 44 L 85 326 L 56 326 Z" fill="#ffffff" fill-opacity="0.07"/>
    
        <!-- Xiaomi 14 Ultra Giant Centered Circular LEICA Quad-Camera Disc -->
        <circle cx="122" cy="112" r="52" fill="#09090b" stroke="#d4af37" stroke-width="3.5"/>
        <circle cx="122" cy="112" r="46" fill="#18181b" stroke="#52525b" stroke-width="1"/>
        <circle cx="104" cy="94" r="11" fill="#000" stroke="#71717a" stroke-width="1.8"/>
        <circle cx="140" cy="94" r="11" fill="#000" stroke="#71717a" stroke-width="1.8"/>
        <circle cx="104" cy="130" r="11" fill="#000" stroke="#71717a" stroke-width="1.8"/>
        <circle cx="140" cy="130" r="11" fill="#000" stroke="#71717a" stroke-width="1.8"/>
        <text x="122" y="115" text-anchor="middle" fill="#ef4444" font-family="Inter,sans-serif" font-size="8" font-weight="900" letter-spacing="1.5">LEICA</text>
        
    <text x="122" y="302" text-anchor="middle" fill="#ffffff" fill-opacity="0.55" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="800" letter-spacing="2">XIAOMI</text>
  </g>

  <!-- FRONT DISPLAY (Right Overlapping Device Showing Screen & Wallpaper) -->
  <g filter="url(#drop-xiaomi-14-ultra)">
    <rect x="172" y="38" width="138" height="292" rx="22" fill="#050811" stroke="#d4af37" stroke-width="2.5"/>
    <rect x="177" y="43" width="128" height="282" rx="19" fill="url(#scr-xiaomi-14-ultra)"/>
    <!-- Dynamic Abstract Wallpaper Graphic -->
    <circle cx="241" cy="165" r="56" fill="#fb923c" fill-opacity="0.28"/>
    <path d="M 177 220 Q 241 155 305 240 L 305 325 L 177 325 Z" fill="#27272a" fill-opacity="0.32"/>
    <circle cx="241" cy="57" r="4.5" fill="#050811"/>
    <!-- Clean Model Signature on Screen -->
    <text x="241" y="102" text-anchor="middle" fill="#ffffff" fill-opacity="0.8" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2">XIAOMI</text>
    <text x="241" y="122" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800">Xiaomi 14 Ultra</text>
  </g>
</svg>