<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="720" height="760">
  <defs>
    <linearGradient id="back-oppo-reno-11f-5g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="scr-oppo-reno-11f-5g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="glow-oppo-reno-11f-5g" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop-oppo-reno-11f-5g" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Ambient Backlight Glow -->
  <circle cx="185" cy="190" r="145" fill="url(#glow-oppo-reno-11f-5g)"/>

  <!-- REAR CHASSIS (Left Device Showing Exact Model Camera Architecture) -->
  <g filter="url(#drop-oppo-reno-11f-5g)">
    <rect x="54" y="42" width="136" height="286" rx="22" fill="url(#back-oppo-reno-11f-5g)" stroke="#6ee7b7" stroke-width="2.5"/>
    <!-- Metallic Glass Diagonal Sheen -->
    <path d="M 60 44 L 145 44 L 85 326 L 56 326 Z" fill="#ffffff" fill-opacity="0.07"/>
    
    <rect x="64" y="56" width="56" height="84" rx="16" fill="#090d16" fill-opacity="0.75" stroke="#6ee7b7" stroke-width="1.8"/>
    <circle cx="84" cy="78" r="12.5" fill="#000" stroke="#6ee7b7" stroke-width="2"/>
    <circle cx="84" cy="112" r="12.5" fill="#000" stroke="#6ee7b7" stroke-width="2"/>
    <circle cx="108" cy="95" r="7" fill="#000" stroke="#6ee7b7" stroke-width="1.5"/>
    <circle cx="108" cy="72" r="4" fill="#ef4444"/>
    
    <text x="122" y="302" text-anchor="middle" fill="#ffffff" fill-opacity="0.55" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="800" letter-spacing="2">OPPO</text>
  </g>

  <!-- FRONT DISPLAY (Right Overlapping Device Showing Screen & Wallpaper) -->
  <g filter="url(#drop-oppo-reno-11f-5g)">
    <rect x="172" y="38" width="138" height="292" rx="22" fill="#050811" stroke="#6ee7b7" stroke-width="2.5"/>
    <rect x="177" y="43" width="128" height="282" rx="19" fill="url(#scr-oppo-reno-11f-5g)"/>
    <!-- Dynamic Abstract Wallpaper Graphic -->
    <circle cx="241" cy="165" r="56" fill="#34d399" fill-opacity="0.28"/>
    <path d="M 177 220 Q 241 155 305 240 L 305 325 L 177 325 Z" fill="#34d399" fill-opacity="0.32"/>
    <circle cx="241" cy="57" r="4.5" fill="#050811"/>
    <!-- Clean Model Signature on Screen -->
    <text x="241" y="102" text-anchor="middle" fill="#ffffff" fill-opacity="0.8" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2">OPPO</text>
    <text x="241" y="122" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800">Oppo Reno 11F 5G</text>
  </g>
</svg>