<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="720" height="760">
  <defs>
    <linearGradient id="back-apple-iphone-16-pro-max" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c29d7c"/>
      <stop offset="100%" stop-color="#78593c"/>
    </linearGradient>
    <linearGradient id="scr-apple-iphone-16-pro-max" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="glow-apple-iphone-16-pro-max" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop-apple-iphone-16-pro-max" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Ambient Backlight Glow -->
  <circle cx="185" cy="190" r="145" fill="url(#glow-apple-iphone-16-pro-max)"/>

  <!-- REAR CHASSIS (Left Device Showing Exact Model Camera Architecture) -->
  <g filter="url(#drop-apple-iphone-16-pro-max)">
    <rect x="54" y="42" width="136" height="286" rx="26" fill="url(#back-apple-iphone-16-pro-max)" stroke="#d6b89c" stroke-width="2.5"/>
    <!-- Metallic Glass Diagonal Sheen -->
    <path d="M 60 44 L 145 44 L 85 326 L 56 326 Z" fill="#ffffff" fill-opacity="0.07"/>
    
        <!-- iPhone Pro Square Plateau & Triangular Triple Camera -->
        <rect x="64" y="56" width="66" height="68" rx="16" fill="#000000" fill-opacity="0.28" stroke="#d6b89c" stroke-width="1.5"/>
        <circle cx="81" cy="74" r="12.5" fill="#111827" stroke="#d6b89c" stroke-width="2.2"/>
        <circle cx="81" cy="74" r="5" fill="#1e3a8a"/>
        <circle cx="81" cy="105" r="12.5" fill="#111827" stroke="#d6b89c" stroke-width="2.2"/>
        <circle cx="81" cy="105" r="5" fill="#1e3a8a"/>
        <circle cx="111" cy="89.5" r="12.5" fill="#111827" stroke="#d6b89c" stroke-width="2.2"/>
        <circle cx="111" cy="89.5" r="5" fill="#1e3a8a"/>
        <circle cx="111" cy="68" r="4.5" fill="#fef3c7"/>
        <circle cx="111" cy="111" r="5.5" fill="#1f2937"/>
        <circle cx="122" cy="175" r="12" fill="#ffffff" fill-opacity="0.22"/>
        
    <text x="122" y="302" text-anchor="middle" fill="#ffffff" fill-opacity="0.55" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="800" letter-spacing="2">APPLE</text>
  </g>

  <!-- FRONT DISPLAY (Right Overlapping Device Showing Screen & Wallpaper) -->
  <g filter="url(#drop-apple-iphone-16-pro-max)">
    <rect x="172" y="38" width="138" height="292" rx="26" fill="#050811" stroke="#d6b89c" stroke-width="2.5"/>
    <rect x="177" y="43" width="128" height="282" rx="23" fill="url(#scr-apple-iphone-16-pro-max)"/>
    <!-- Dynamic Abstract Wallpaper Graphic -->
    <circle cx="241" cy="165" r="56" fill="#fbbf24" fill-opacity="0.28"/>
    <path d="M 177 220 Q 241 155 305 240 L 305 325 L 177 325 Z" fill="#c29d7c" fill-opacity="0.32"/>
    <rect x="221" y="54" width="40" height="10" rx="5" fill="#050811"/>
    <!-- Clean Model Signature on Screen -->
    <text x="241" y="102" text-anchor="middle" fill="#ffffff" fill-opacity="0.8" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2">APPLE</text>
    <text x="241" y="122" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800">iPhone 16 Pro Max</text>
  </g>
</svg>