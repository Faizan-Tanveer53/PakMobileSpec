<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="720" height="760">
  <defs>
    <linearGradient id="back-vivo-v30e-5g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="scr-vivo-v30e-5g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="glow-vivo-v30e-5g" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop-vivo-v30e-5g" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Ambient Backlight Glow -->
  <circle cx="185" cy="190" r="145" fill="url(#glow-vivo-v30e-5g)"/>

  <!-- REAR CHASSIS (Left Device Showing Exact Model Camera Architecture) -->
  <g filter="url(#drop-vivo-v30e-5g)">
    <rect x="54" y="42" width="136" height="286" rx="24" fill="url(#back-vivo-v30e-5g)" stroke="#c4b5fd" stroke-width="2.5"/>
    <!-- Metallic Glass Diagonal Sheen -->
    <path d="M 60 44 L 145 44 L 85 326 L 56 326 Z" fill="#ffffff" fill-opacity="0.07"/>
    
        <!-- Vivo V40 Pro ZEISS Infinity Pill + Glowing Aura Light Ring -->
        <rect x="64" y="56" width="48" height="96" rx="24" fill="#1e1b4b" stroke="#c4b5fd" stroke-width="1.8"/>
        <circle cx="88" cy="80" r="19" fill="#090d16" stroke="#c4b5fd" stroke-width="1.5"/>
        <circle cx="88" cy="74" r="6" fill="#1e3a8a"/>
        <circle cx="88" cy="88" r="6" fill="#1e3a8a"/>
        <rect x="80" y="103" width="16" height="7" rx="2" fill="#1d4ed8"/>
        <text x="88" y="108.5" text-anchor="middle" fill="#fff" font-size="4.5" font-weight="800">ZEISS</text>
        <!-- Glowing Aura Light Ring -->
        <circle cx="88" cy="128" r="15" fill="none" stroke="#fde68a" stroke-width="3.5"/>
        <circle cx="88" cy="128" r="8" fill="#4c1d95"/>
        
    <text x="122" y="302" text-anchor="middle" fill="#ffffff" fill-opacity="0.55" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="800" letter-spacing="2">VIVO</text>
  </g>

  <!-- FRONT DISPLAY (Right Overlapping Device Showing Screen & Wallpaper) -->
  <g filter="url(#drop-vivo-v30e-5g)">
    <rect x="172" y="38" width="138" height="292" rx="24" fill="#050811" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="177" y="43" width="128" height="282" rx="21" fill="url(#scr-vivo-v30e-5g)"/>
    <!-- Dynamic Abstract Wallpaper Graphic -->
    <circle cx="241" cy="165" r="56" fill="#a78bfa" fill-opacity="0.28"/>
    <path d="M 177 220 Q 241 155 305 240 L 305 325 L 177 325 Z" fill="#38bdf8" fill-opacity="0.32"/>
    <circle cx="241" cy="57" r="4.5" fill="#050811"/>
    <!-- Clean Model Signature on Screen -->
    <text x="241" y="102" text-anchor="middle" fill="#ffffff" fill-opacity="0.8" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2">VIVO</text>
    <text x="241" y="122" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800">Vivo V30e 5G</text>
  </g>
</svg>