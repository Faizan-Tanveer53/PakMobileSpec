<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="720" height="760">
  <defs>
    <linearGradient id="back-infinix-note-40-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="scr-infinix-note-40-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="glow-infinix-note-40-pro" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop-infinix-note-40-pro" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Ambient Backlight Glow -->
  <circle cx="185" cy="190" r="145" fill="url(#glow-infinix-note-40-pro)"/>

  <!-- REAR CHASSIS (Left Device Showing Exact Model Camera Architecture) -->
  <g filter="url(#drop-infinix-note-40-pro)">
    <rect x="54" y="42" width="136" height="286" rx="20" fill="url(#back-infinix-note-40-pro)" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Metallic Glass Diagonal Sheen -->
    <path d="M 60 44 L 145 44 L 85 326 L 56 326 Z" fill="#ffffff" fill-opacity="0.07"/>
    
        <!-- Infinix GT 20 Pro Cyber Mecha RGB Loop & Gaming Visor -->
        <polygon points="62,56 128,56 136,128 62,128" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
        <circle cx="84" cy="78" r="12" fill="#000" stroke="#38bdf8" stroke-width="1.8"/>
        <circle cx="84" cy="108" r="12" fill="#000" stroke="#38bdf8" stroke-width="1.8"/>
        <circle cx="114" cy="93" r="9" fill="#000" stroke="#38bdf8" stroke-width="1.5"/>
        <path d="M 145 95 A 38 38 0 1 1 145 165" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
        
    <text x="122" y="302" text-anchor="middle" fill="#ffffff" fill-opacity="0.55" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="800" letter-spacing="2">INFINIX</text>
  </g>

  <!-- FRONT DISPLAY (Right Overlapping Device Showing Screen & Wallpaper) -->
  <g filter="url(#drop-infinix-note-40-pro)">
    <rect x="172" y="38" width="138" height="292" rx="20" fill="#050811" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="177" y="43" width="128" height="282" rx="17" fill="url(#scr-infinix-note-40-pro)"/>
    <!-- Dynamic Abstract Wallpaper Graphic -->
    <circle cx="241" cy="165" r="56" fill="#818cf8" fill-opacity="0.28"/>
    <path d="M 177 220 Q 241 155 305 240 L 305 325 L 177 325 Z" fill="#059669" fill-opacity="0.32"/>
    <circle cx="241" cy="57" r="4.5" fill="#050811"/>
    <!-- Clean Model Signature on Screen -->
    <text x="241" y="102" text-anchor="middle" fill="#ffffff" fill-opacity="0.8" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2">INFINIX</text>
    <text x="241" y="122" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800">Infinix Note 40 Pro</text>
  </g>
</svg>