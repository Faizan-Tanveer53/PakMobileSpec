<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="720" height="760">
  <defs>
    <linearGradient id="back-apple-iphone-16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="scr-apple-iphone-16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="glow-apple-iphone-16" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop-apple-iphone-16" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Ambient Backlight Glow -->
  <circle cx="185" cy="190" r="145" fill="url(#glow-apple-iphone-16)"/>

  <!-- REAR CHASSIS (Left Device Showing Exact Model Camera Architecture) -->
  <g filter="url(#drop-apple-iphone-16)">
    <rect x="54" y="42" width="136" height="286" rx="26" fill="url(#back-apple-iphone-16)" stroke="#818cf8" stroke-width="2.5"/>
    <!-- Metallic Glass Diagonal Sheen -->
    <path d="M 60 44 L 145 44 L 85 326 L 56 326 Z" fill="#ffffff" fill-opacity="0.07"/>
    
        <!-- iPhone 16 Vertical Pill Dual Camera -->
        <rect x="66" y="58" width="40" height="72" rx="20" fill="#000000" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.5"/>
        <circle cx="86" cy="77" r="12.5" fill="#111827" stroke="#818cf8" stroke-width="2.2"/>
        <circle cx="86" cy="111" r="12.5" fill="#111827" stroke="#818cf8" stroke-width="2.2"/>
        <circle cx="116" cy="94" r="4.5" fill="#fef3c7"/>
        
    <text x="122" y="302" text-anchor="middle" fill="#ffffff" fill-opacity="0.55" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="800" letter-spacing="2">APPLE</text>
  </g>

  <!-- FRONT DISPLAY (Right Overlapping Device Showing Screen & Wallpaper) -->
  <g filter="url(#drop-apple-iphone-16)">
    <rect x="172" y="38" width="138" height="292" rx="26" fill="#050811" stroke="#818cf8" stroke-width="2.5"/>
    <rect x="177" y="43" width="128" height="282" rx="23" fill="url(#scr-apple-iphone-16)"/>
    <!-- Dynamic Abstract Wallpaper Graphic -->
    <circle cx="241" cy="165" r="56" fill="#a5b4fc" fill-opacity="0.28"/>
    <path d="M 177 220 Q 241 155 305 240 L 305 325 L 177 325 Z" fill="#6366f1" fill-opacity="0.32"/>
    <rect x="221" y="54" width="40" height="10" rx="5" fill="#050811"/>
    <!-- Clean Model Signature on Screen -->
    <text x="241" y="102" text-anchor="middle" fill="#ffffff" fill-opacity="0.8" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2">APPLE</text>
    <text x="241" y="122" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="800">iPhone 16</text>
  </g>
</svg>